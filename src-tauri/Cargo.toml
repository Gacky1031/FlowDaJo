[package]
name = "flowdesk-tauri"
version = "0.4.0"
description = "FlowDaJo flow cytometry desktop analysis with R and flowCore"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde_json = "1"
lopdf = { version = "0.45", default-features = false }

[profile.release]
strip = true
lto = true
codegen-units = 1
